<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <div class="brand">
                <i class="fa-solid fa-list-check"></i>
                <span>TaskFlow</span>
            </div>
            <div id="nav-actions" style="display: flex; align-items: center; gap: 1rem;">
                <!-- Dynamically populated -->
            </div>
        </div>
    </header>

    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>Projects</h3>
                <button class="btn btn-sm btn-primary" onclick="openModal('create-project-modal')">+ New</button>
            </div>
            <ul id="projects-list" class="projects-list"></ul>
        </aside>

        <main class="board-workspace">
            <div class="board-header">
                <div>
                    <h2 id="current-project-title">Select or Create a Project</h2>
                    <div id="project-members" class="members-pills" style="margin-top: 0.5rem;"></div>
                </div>
                <button id="btn-invite-member" class="btn btn-sm btn-primary" style="display:none;" onclick="openModal('invite-member-modal')">
                    <i class="fa-solid fa-user-plus"></i> Invite Member
                </button>
            </div>

            <div class="kanban-board" id="kanban-board" style="display: none;">
                <div class="kanban-column">
                    <div class="column-header todo">
                        <span><i class="fa-regular fa-circle"></i> To Do</span>
                        <button class="icon-btn" onclick="openCreateTaskModal('todo')"><i class="fa-solid fa-plus"></i></button>
                    </div>
                    <div class="task-list" id="col-todo"></div>
                </div>
                <div class="kanban-column">
                    <div class="column-header progress">
                        <span><i class="fa-solid fa-spinner"></i> In Progress</span>
                        <button class="icon-btn" onclick="openCreateTaskModal('in_progress')"><i class="fa-solid fa-plus"></i></button>
                    </div>
                    <div class="task-list" id="col-in_progress"></div>
                </div>
                <div class="kanban-column">
                    <div class="column-header done">
                        <span><i class="fa-regular fa-circle-check"></i> Done</span>
                        <button class="icon-btn" onclick="openCreateTaskModal('done')"><i class="fa-solid fa-plus"></i></button>
                    </div>
                    <div class="task-list" id="col-done"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Invite Member Modal -->
    <div class="modal-overlay" id="invite-member-modal">
        <div class="modal-card">
            <button class="modal-close" onclick="closeModal('invite-member-modal')">&times;</button>
            <h3>Invite Member to Project</h3>
            <form onsubmit="handleInviteMember(event)">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="invite-username-input" required placeholder="Enter registered username">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Send Invite</button>
            </form>
        </div>
    </div>

    <!-- Create Project Modal -->
    <div class="modal-overlay" id="create-project-modal">
        <div class="modal-card">
            <button class="modal-close" onclick="closeModal('create-project-modal')">&times;</button>
            <h3>Create Group Project</h3>
            <form onsubmit="handleCreateProject(event)">
                <div class="input-group">
                    <label>Project Title</label>
                    <input type="text" id="project-name-input" required placeholder="e.g. Website Redesign">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Create Project</button>
            </form>
        </div>
    </div>

    <!-- Create Task Modal -->
    <div class="modal-overlay" id="create-task-modal">
        <div class="modal-card">
            <button class="modal-close" onclick="closeModal('create-task-modal')">&times;</button>
            <h3>Create Task</h3>
            <form onsubmit="handleCreateTask(event)">
                <input type="hidden" id="task-status-input">
                <div class="input-group">
                    <label>Task Title</label>
                    <input type="text" id="task-title-input" required placeholder="e.g. Design Navbar UI">
                </div>
                <div class="input-group">
                    <label>Assignee</label>
                    <select id="task-assignee-select"></select>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Add Task</button>
            </form>
        </div>
    </div>

    <!-- Task Detail Modal (Allows Status & Assignee Editing) -->
    <div class="modal-overlay" id="task-detail-modal">
        <div class="modal-card modal-lg">
            <button class="modal-close" onclick="closeModal('task-detail-modal')">&times;</button>
            <div id="task-detail-content"></div>
        </div>
    </div>

    <!-- Auth Modal -->
    <div class="modal-overlay" id="auth-modal">
        <div class="modal-card">
            <h3 id="auth-title">Welcome to TaskFlow</h3>
            <form id="auth-form" onsubmit="handleAuth(event)">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="auth-username" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="auth-password" required>
                </div>
                <button type="submit" id="auth-submit-btn" class="btn btn-primary btn-block">Log In</button>
            </form>
            <div class="modal-footer" style="margin-top: 1rem;">
                <a href="#" id="auth-toggle-btn" onclick="toggleAuthMode()">New user? Register</a>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
